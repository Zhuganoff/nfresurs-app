<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>нефтересурс</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="./telegram-web-app.js"></script>
<style>
  :root {
    --app-bg: #f2f4f6; --surface: #ffffff; --surface-2: #eef1f4;
    --text: #14181d; --text-dim: #5a636d; --text-faint: #8b949e;
    --hair: #dfe3e8; --accent: #b9741a; --accent-soft: #f3e6d3;
    --urgent: #c1443b; --fresh: #2f8a5f; --nav-bg: #ffffffee;
  }
  :root:not([data-theme="light"]) { @media (prefers-color-scheme: dark) {
    --app-bg:#0e1621; --surface:#17212b; --surface-2:#1d2a37;
    --text:#e9eef2; --text-dim:#93a2b1; --text-faint:#6b7c8c;
    --hair:#22303d; --accent:#e0982f; --accent-soft:#2a2416;
    --urgent:#e0655b; --fresh:#4bb083; --nav-bg:#17212bee;
  }}
  :root[data-theme="dark"] {
    --app-bg:#0e1621; --surface:#17212b; --surface-2:#1d2a37;
    --text:#e9eef2; --text-dim:#93a2b1; --text-faint:#6b7c8c;
    --hair:#22303d; --accent:#e0982f; --accent-soft:#2a2416;
    --urgent:#e0655b; --fresh:#4bb083; --nav-bg:#17212bee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--app-bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header.app {
    flex: none; padding: 12px 16px 12px; border-bottom: 1px solid var(--hair);
    display: flex; align-items: center; gap: 12px; background: var(--app-bg);
    padding-top: calc(12px + env(safe-area-inset-top));
  }
  .logo {
    width: 36px; height: 36px; border-radius: 10px; flex: none;
    background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #000));
    display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .app-name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
  .app-sub { font-size: 11px; color: var(--text-faint); margin-top: 1px; letter-spacing: .04em; }
  main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .pane { display: none; padding: 12px 12px 20px; }
  .pane.active { display: block; }
  .pane-head { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 4px 12px; }
  .pane-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .pane-head .count { font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .card { background: var(--surface); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 14px 12px; margin-bottom: 10px; }
  .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .chip { font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .also-chip { font-size: 11px; color: var(--text-faint); }
  .fav { margin-left: auto; flex: none; width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--surface-2); cursor: pointer; display: grid; place-items: center; color: var(--text-faint); transition: transform .12s, color .12s, background .12s; }
  .fav:active { transform: scale(1.15); }
  .fav.on { color: var(--accent); background: var(--accent-soft); }
  .fav svg { width: 16px; height: 16px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; line-height: 1.34; font-weight: 600; text-wrap: balance; }
  .meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 11px; }
  .price { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .price.none { font-weight: 500; color: var(--text-faint); font-size: 13px; }
  .deadline { font-size: 12.5px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .deadline .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
  .deadline.urgent { color: var(--urgent); font-weight: 600; }
  .deadline.urgent .dot { background: var(--urgent); }
  .deadline.fresh .dot { background: var(--fresh); }
  .open { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .open svg { width: 13px; height: 13px; }
  .empty { text-align: center; color: var(--text-faint); padding: 60px 30px; font-size: 14px; line-height: 1.6; }
  .empty svg { width: 40px; height: 40px; opacity: .4; margin-bottom: 12px; }
  .group { margin-bottom: 22px; }
  .group > .label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); font-weight: 600; padding: 0 6px 8px; }
  .rows { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--hair); }
  .row:last-child { border-bottom: none; }
  .row .ic { width: 20px; flex: none; color: var(--text-dim); display: grid; place-items: center; }
  .row .ic svg { width: 18px; height: 18px; }
  .row .rl { font-size: 14.5px; }
  .row .rv { margin-left: auto; font-size: 13.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 7px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .status-dot.on { background: var(--fresh); }
  .status-dot.off { background: var(--text-faint); }
  .status-dot.wait { background: var(--accent); }
  select.tz { background: var(--surface-2); color: var(--text); border: 1px solid var(--hair); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
  nav.tabbar { flex: none; display: flex; background: var(--nav-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--hair); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
  nav.tabbar button { flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-faint); font-size: 11px; font-weight: 600; padding: 4px 0; transition: color .12s; position: relative; }
  nav.tabbar button svg { width: 24px; height: 24px; }
  nav.tabbar button.active { color: var(--accent); }
  nav.tabbar .badge { position: absolute; top: 0; left: 50%; margin-left: 6px; min-width: 16px; height: 16px; padding: 0 4px; background: var(--accent); color: #fff; border-radius: 999px; font-size: 10px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--hair); border-top-color: var(--accent); border-radius: 50%; margin: 60px auto; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
  <header class="app">
    <div class="logo">Н</div>
    <div>
      <div class="app-name">нефтересурс</div>
      <div class="app-sub">ТОРГИ · РЕАЛИЗАЦИЯ НЕФТЕПРОДУКТОВ</div>
    </div>
  </header>

  <main>
    <section class="pane active" id="pane-feed">
      <div class="pane-head"><h2>Тендеры</h2><span class="count" id="feed-count"></span></div>
      <div id="feed-list"><div class="spinner"></div></div>
    </section>
    <section class="pane" id="pane-fav">
      <div class="pane-head"><h2>Избранное</h2><span class="count" id="fav-count"></span></div>
      <div id="fav-list"></div>
    </section>
    <section class="pane" id="pane-profile">
      <div class="pane-head"><h2>Мой профиль</h2></div>
      <div class="group">
        <div class="label">Уведомления</div>
        <div class="rows">
          <div class="row">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 1 6 6v4l2 3H4l2-3V9a6 6 0 0 1 6-6Z"/><path d="M9.5 20a2.5 2.5 0 0 0 5 0"/></svg></span>
            <span class="rl">Дайджест</span><span class="rv">каждый день · 12:00</span>
          </div>
          <div class="row">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
            <span class="rl">Часовой пояс</span>
            <span class="rv"><select class="tz" id="tz"><option>МСК (UTC+3)</option><option>Екатеринбург (UTC+5)</option><option>Новосибирск (UTC+7)</option><option>Владивосток (UTC+10)</option></select></span>
          </div>
        </div>
      </div>
      <div class="group">
        <div class="label">Площадки · <span id="plat-on"></span> из 8</div>
        <div class="rows" id="plat-rows"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="feed" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Тендеры</button>
    <button data-tab="fav"><span class="badge" id="fav-badge" style="display:none">0</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.5-9.3-9A5 5 0 0 1 12 5.5 5 5 0 0 1 21.3 11C19 15.5 12 20 12 20Z"/></svg>Избранное</button>
    <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Профиль</button>
  </nav>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready(); tg.expand();
  const apply = () => document.documentElement.setAttribute('data-theme', tg.colorScheme || 'light');
  apply(); tg.onEvent('themeChanged', apply);
}

const PLATFORMS = {tektorg:'ТЭК-Торг',rosneft:'Роснефть',etpgpb:'ЭТП ГПБ',b2b_center:'B2B-Center',onlinecontract:'OnlineContract',sberbank_ast:'Сбербанк-АСТ',interrao:'Интер РАО',nelikvidi:'Неликвиды'};
const PSTATE = {tektorg:'on',rosneft:'on',etpgpb:'on',b2b_center:'on',onlinecontract:'on',sberbank_ast:'on',interrao:'on',nelikvidi:'wait'};
const REF = new Date();
let TENDERS = [], favs = new Set();

function cleanTitle(t){return t.replace(/^Запрос предложений №\s*\d+\s*/,'').replace(/^Условия процедуры реализации\s*/i,'').replace(/\s+/g,' ').trim();}
function fmtPrice(p){if(!p)return null;const m=p.match(/([\d\s.,]+)\s*(RUB|₽|руб)?/i);if(!m)return p;let n=parseFloat(m[1].replace(/\s/g,'').replace(',','.'));return isNaN(n)?p:n.toLocaleString('ru-RU',{maximumFractionDigits:0})+' ₽';}
function pDate(d){if(!d)return null;let m=d.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=d.match(/(\d{2})\.(\d{2})\.(\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);return null;}
function dlInfo(d){const dt=pDate(d);if(!dt)return{txt:'срок в описании',cls:''};const days=Math.round((dt-REF)/864e5);const lab=dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});if(days<0)return{txt:'завершён',cls:''};if(days<=2)return{txt:`до ${lab} · ${days===0?'сегодня':days+' дн.'}`,cls:'urgent'};if(days<=14)return{txt:`до ${lab}`,cls:''};return{txt:`до ${lab}`,cls:'fresh'};}
const heart=f=>f?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7-4.5-9.3-9A5 5 0 0 1 12 5.5 5 5 0 0 1 21.3 11C19 15.5 12 20 12 20Z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.5-9.3-9A5 5 0 0 1 12 5.5 5 5 0 0 1 21.3 11C19 15.5 12 20 12 20Z"/></svg>';

function key(t){return t.site+':'+(t.url||t.title);}
function card(t){
  const price=fmtPrice(t.price), dl=dlInfo(t.deadline), on=favs.has(key(t));
  const also=(t.also||[]).map(a=>`<span class="also-chip">+ ${a.site_title}</span>`).join(' ');
  return `<article class="card"><div class="top"><span class="chip">${t.site_title||PLATFORMS[t.site]||t.site}</span>${also}<button class="fav ${on?'on':''}" data-k="${encodeURIComponent(key(t))}">${heart(on)}</button></div>
  <h3>${cleanTitle(t.title)}</h3>
  <div class="meta">${price?`<span class="price">${price}</span>`:'<span class="price none">цена по запросу</span>'}<span class="deadline ${dl.cls}"><span class="dot"></span>${dl.txt}</span></div>
  <a class="open" href="${t.url}" target="_blank" rel="noopener">Открыть на площадке<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg></a></article>`;
}
function render(){
  document.getElementById('feed-list').innerHTML = TENDERS.length?TENDERS.map(card).join(''):'<div class="empty">Пока нет активных лотов.</div>';
  document.getElementById('feed-count').textContent = TENDERS.length+' лотов';
  const fv=TENDERS.filter(t=>favs.has(key(t)));
  document.getElementById('fav-list').innerHTML = fv.length?fv.map(card).join(''):`<div class="empty">${heart(false)}<div>Отмечайте лоты ♥ во вкладке «Тендеры» — они появятся здесь.</div></div>`;
  document.getElementById('fav-count').textContent = fv.length+' сохранено';
  const b=document.getElementById('fav-badge'); b.textContent=fv.length; b.style.display=fv.length?'grid':'none';
  document.getElementById('plat-on').textContent = Object.values(PSTATE).filter(s=>s==='on').length;
  const st={on:'работает',off:'выкл',wait:'скоро'};
  document.getElementById('plat-rows').innerHTML = Object.keys(PLATFORMS).map(k=>`<div class="row"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg></span><span class="rl">${PLATFORMS[k]}</span><span class="rv"><span class="status-dot ${PSTATE[k]}"></span>${st[PSTATE[k]]}</span></div>`).join('');
}

// избранное: Telegram CloudStorage, иначе localStorage
function loadFavs(cb){
  if(tg && tg.CloudStorage && tg.CloudStorage.getItem){
    tg.CloudStorage.getItem('favs',(e,v)=>{try{(JSON.parse(v||'[]')).forEach(x=>favs.add(x));}catch(_){}cb();});
  } else { try{(JSON.parse(localStorage.getItem('favs')||'[]')).forEach(x=>favs.add(x));}catch(_){}; cb(); }
}
function saveFavs(){
  const arr=[...favs];
  if(tg && tg.CloudStorage && tg.CloudStorage.setItem) tg.CloudStorage.setItem('favs',JSON.stringify(arr));
  else localStorage.setItem('favs',JSON.stringify(arr));
}

document.addEventListener('click',e=>{
  const f=e.target.closest('.fav');
  if(f){const k=decodeURIComponent(f.dataset.k);favs.has(k)?favs.delete(k):favs.add(k);saveFavs();if(tg&&tg.HapticFeedback)tg.HapticFeedback.selectionChanged();render();return;}
  const tab=e.target.closest('nav.tabbar button');
  if(tab){document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));tab.classList.add('active');document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));document.getElementById('pane-'+tab.dataset.tab).classList.add('active');document.querySelector('main').scrollTop=0;}
});

fetch('./tenders.json?v='+Date.now()).then(r=>r.json()).then(d=>{TENDERS=d.tenders||[];loadFavs(render);}).catch(()=>{document.getElementById('feed-list').innerHTML='<div class="empty">Не удалось загрузить лоты. Попробуйте позже.</div>';});
</script>
</body>
</html>
