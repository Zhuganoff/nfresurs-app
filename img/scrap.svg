<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Пакеты прессованного металлолома">
  <defs>
    <linearGradient id="sTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3ecf3"/><stop offset=".55" stop-color="#a3b3c0"/><stop offset="1" stop-color="#71818e"/>
    </linearGradient>
    <linearGradient id="sFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b9ba9"/><stop offset="1" stop-color="#3a444f"/>
    </linearGradient>
    <linearGradient id="sSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a6875" stop-opacity="1"/><stop offset="1" stop-color="#272f38"/>
    </linearGradient>
    <linearGradient id="sBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3dfe8"/><stop offset="1" stop-color="#76838f"/>
    </linearGradient>
    <linearGradient id="sRust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4744f"/><stop offset="1" stop-color="#8a4526"/>
    </linearGradient>
  </defs>

  <ellipse cx="120" cy="192" rx="88" ry="12" fill="#0b1116" opacity=".85"/>

  <!-- нижний пакет -->
  <g>
    <path d="M40 138 L120 110 L200 138 L120 166 Z" fill="url(#sTop)"/>
    <path d="M40 138 L120 166 L120 196 L40 168 Z" fill="url(#sFront)"/>
    <path d="M200 138 L120 166 L120 196 L200 168 Z" fill="url(#sSide)"/>
    <path d="M76 124 L76 184" stroke="url(#sBand)" stroke-width="4.4"/>
    <path d="M164 124 L164 184" stroke="url(#sBand)" stroke-width="4.4"/>
    <path d="M40 138 L120 166 L200 138" stroke="#f2f7fb" stroke-opacity=".28" stroke-width="1.6" fill="none"/>
  </g>

  <!-- верхний пакет -->
  <g>
    <path d="M60 88 L120 66 L180 88 L120 110 Z" fill="url(#sTop)"/>
    <path d="M60 88 L120 110 L120 138 L60 116 Z" fill="url(#sFront)"/>
    <path d="M180 88 L120 110 L120 138 L180 116 Z" fill="url(#sSide)"/>
    <path d="M88 76 L88 128" stroke="url(#sBand)" stroke-width="3.8"/>
    <path d="M152 76 L152 128" stroke="url(#sBand)" stroke-width="3.8"/>
    <path d="M60 88 L120 110 L180 88" stroke="#f2f7fb" stroke-opacity=".3" stroke-width="1.5" fill="none"/>
  </g>

  <!-- торчащие обрезки -->
  <g stroke-linecap="round" fill="none">
    <path d="M94 72 L74 44" stroke="url(#sBand)" stroke-width="5.4"/>
    <path d="M120 66 L126 34" stroke="url(#sRust)" stroke-width="5.4"/>
    <path d="M146 72 L170 48" stroke="url(#sBand)" stroke-width="4.6"/>
    <path d="M134 70 L154 56" stroke="url(#sRust)" stroke-width="3.8" opacity=".9"/>
  </g>

  <path d="M70 128 L112 113" stroke="#ffffff" stroke-opacity=".32" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M84 100 L114 89" stroke="#ffffff" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/>
</svg>
